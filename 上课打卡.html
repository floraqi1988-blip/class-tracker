<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F5F0EB">
<title>课包打卡</title>
<style>
:root {
  --bg:#F5F0EB;--card:#FFF;--primary:#FF8A65;--primary-light:#FFE0B2;
  --secondary:#42A5F5;--success:#66BB6A;--success-light:#C8E6C9;
  --danger:#EF5350;--text:#37474F;--text2:#78909C;--border:#E0E0E0;
  --shadow:0 2px 12px rgba(0,0,0,.08);--r:16px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
  padding-top:var(--safe-t);padding-bottom:calc(80px + var(--safe-b))}

/* Header */
.hdr{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 16px 0;
  display:flex;align-items:center;justify-content:space-between}
.hdr h1{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px}
.hdr-right{display:flex;gap:6px;align-items:center}
.ibtn{width:36px;height:36px;border-radius:50%;background:var(--card);border:none;font-size:18px;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer}
.ibtn:active{transform:scale(.9)}

/* Sync dot */
.sync-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:var(--success)}.sync-dot.off{background:#BDBDBD}
.sync-dot.syncing{background:#FFA726;animation:pulse 1s infinite}
.sync-dot.err{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Nav tabs */
.nav{display:flex;gap:0;margin:10px 16px 0;background:#E8E0D8;border-radius:12px;padding:3px}
.nav-btn{flex:1;padding:8px 0;border:none;border-radius:10px;background:transparent;
  font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .2s}
.nav-btn.active{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* Views */
.view{display:none;padding:12px 16px}.view.active{display:block}

/* Summary */
.sbar{display:flex;gap:10px;padding-bottom:12px;overflow-x:auto;scrollbar-width:none}
.sbar::-webkit-scrollbar{display:none}
.schip{flex-shrink:0;background:var(--card);border-radius:12px;padding:8px 14px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.schip .n{font-size:18px;font-weight:700}.schip .l{font-size:11px;color:var(--text2)}

/* Course cards */
.clist{display:flex;flex-direction:column;gap:12px}
.ccard{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);
  position:relative;transition:transform .15s;cursor:pointer}
.ccard:active{transform:scale(.98)}
.ctop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cicon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.cinfo{flex:1;min-width:0}.cname{font-size:16px;font-weight:600}.csub{font-size:12px;color:var(--text2)}
.cstats{display:flex;gap:16px}
.si{text-align:center}.si .v{font-size:20px;font-weight:700}.si .l{font-size:10px;color:var(--text2);margin-top:1px}
.v.rem{color:var(--primary)}.v.used{color:var(--text2)}.v.tot{color:var(--secondary)}
.pbar{height:5px;background:#F0F0F0;border-radius:3px;margin-top:12px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .5s;background:linear-gradient(90deg,var(--primary),#FFB74D)}
.ckbtn{position:absolute;right:12px;top:12px;background:var(--primary);color:#fff;border:none;
  border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;
  box-shadow:0 2px 8px rgba(255,138,101,.4);transition:transform .15s}
.ckbtn:active{transform:scale(.9)}
.ckbtn.done{background:var(--success);box-shadow:0 2px 8px rgba(102,187,106,.4)}

/* Empty */
.empty{text-align:center;padding:50px 30px;color:var(--text2)}
.empty .em{font-size:56px;margin-bottom:12px}.empty p{font-size:14px;line-height:1.6}

/* Calendar */
.cal-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 0 12px}
.cal-title{font-size:17px;font-weight:700}
.cal-nav{width:36px;height:36px;border-radius:50%;background:var(--card);border:none;font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow)}
.cal-nav:active{transform:scale(.9)}
.wkdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:4px}
.wkdays span{font-size:12px;color:var(--text2);font-weight:500;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cday{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:12px;cursor:pointer;transition:all .15s;position:relative;padding:4px 0}
.cday:active{background:#F0EBE5}
.cday.other{opacity:.25;pointer-events:none}
.cday .dn{font-size:15px;font-weight:500;line-height:1}
.cday.today{background:#E3F2FD}.cday.today .dn{color:var(--secondary);font-weight:700}
.cday.sel{background:var(--primary-light);outline:2px solid var(--primary)}
.cday .dots{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap;justify-content:center;max-width:100%}
.cday .dot{width:5px;height:5px;border-radius:50%}

/* Day detail panel */
.day-panel{margin-top:12px;background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.day-panel-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.day-panel-title .wd{font-size:13px;color:var(--text2);font-weight:400}
.dcourse{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F5F5F5}
.dcourse:last-child{border-bottom:none}
.dcourse-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.dcourse-info{flex:1;min-width:0}.dcourse-name{font-size:14px;font-weight:600}.dcourse-sub{font-size:11px;color:var(--text2)}
.dcourse-btn{border:none;border-radius:16px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.dcourse-btn:active{transform:scale(.92)}
.dcourse-btn.checkin{background:var(--primary);color:#fff}
.dcourse-btn.checked{background:var(--success-light);color:#388E3C}
.dcourse-btn.full{background:#F5F5F5;color:#999}

/* Modals */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.overlay.show{display:flex}
.mbox{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:500px;
  max-height:88vh;padding:20px 16px calc(20px + var(--safe-b));overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mtitle{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.mclose{width:30px;height:30px;border-radius:50%;background:#F0F0F0;border:none;font-size:16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.fg{margin-bottom:14px}
.fl{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block}
.fi{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-size:15px;
  outline:none;transition:border-color .2s;background:#FAFAFA}
.fi:focus{border-color:var(--primary);background:#fff}
.ipick{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0}
.iopt{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:24px;border:2px solid transparent;cursor:pointer;background:#F5F5F5;transition:all .15s}
.iopt.sel{border-color:var(--primary);background:var(--primary-light)}
.cpick{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.copt{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all .15s}
.copt.sel{border-color:var(--text);transform:scale(1.15)}
.btn-p{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:12px;
  font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s}
.btn-p:active{transform:scale(.97)}
.btn-s{width:100%;padding:12px;background:#F0F0F0;color:var(--text);border:none;border-radius:12px;
  font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}

/* Detail modal */
.dhdr{text-align:center;padding:8px 0 16px}
.dicon{width:64px;height:64px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;
  font-size:36px;margin-bottom:8px}
.dname{font-size:20px;font-weight:700}
.dnums{display:flex;justify-content:center;gap:28px;margin:16px 0;padding:14px;background:#F8F8F8;border-radius:12px}
.dni{text-align:center}.dni .v{font-size:24px;font-weight:700}.dni .l{font-size:11px;color:var(--text2);margin-top:2px}
.hlist{max-height:45vh;overflow-y:auto}
.hitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F5F5F5}
.hitem:last-child{border-bottom:none}
.hdot{width:7px;height:7px;border-radius:50%;background:var(--success);flex-shrink:0}
.hdate{font-size:14px;font-weight:500;flex:1}.hday{font-size:11px;color:var(--text2)}
.hundo{font-size:11px;color:var(--danger);background:none;border:1px solid var(--danger);
  border-radius:6px;padding:3px 8px;cursor:pointer}
.danger{margin-top:20px;padding-top:14px;border-top:1px solid #F0F0F0}
.btn-d{width:100%;padding:10px;background:none;color:var(--danger);border:1px solid var(--danger);
  border-radius:10px;font-size:13px;cursor:pointer}

/* FAB */
.fab{position:fixed;right:16px;bottom:calc(20px + var(--safe-b));width:52px;height:52px;border-radius:50%;
  background:var(--primary);color:#fff;border:none;font-size:26px;display:flex;align-items:center;
  justify-content:center;box-shadow:0 4px 16px rgba(255,138,101,.5);cursor:pointer;z-index:50}
.fab:active{transform:scale(.9)}

/* Confirm anim */
.ckanim{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--success);
  color:#fff;border-radius:50%;width:72px;height:72px;display:flex;align-items:center;justify-content:center;
  font-size:36px;z-index:200;animation:popIn .6s ease forwards;box-shadow:0 4px 20px rgba(102,187,106,.5)}
@keyframes popIn{0%{transform:translate(-50%,-50%) scale(0);opacity:0}50%{transform:translate(-50%,-50%) scale(1.2);opacity:1}
  70%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* Toast */
.toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);
  color:#fff;padding:8px 20px;border-radius:18px;font-size:13px;z-index:300}

/* Setup banner */
.setup-banner{margin:0 16px 8px;padding:12px 14px;background:#FFF3E0;border-radius:12px;
  display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:var(--shadow)}
.setup-banner .sb-text{flex:1;font-size:13px;color:#E65100;line-height:1.4}
.setup-banner .sb-arrow{font-size:18px;color:#E65100}

/* Setup instructions */
.setup-steps{background:#F8F8F8;border-radius:12px;padding:14px;margin-bottom:16px;font-size:13px;line-height:1.8;color:var(--text)}
.setup-steps ol{padding-left:18px}.setup-steps li{margin-bottom:4px}
.setup-steps a{color:var(--secondary);text-decoration:underline}
.setup-steps code{background:#E8E0D8;padding:1px 6px;border-radius:4px;font-size:12px}
</style>
</head>
<body>

<div class="hdr">
  <h1>课包打卡 <span class="sync-dot off" id="syncDot" title="未连接"></span></h1>
  <div class="hdr-right">
    <button class="ibtn" onclick="showSetup()" title="同步设置">⚙</button>
  </div>
</div>
<div class="nav">
  <button class="nav-btn active" onclick="switchView('courses')">课程</button>
  <button class="nav-btn" onclick="switchView('calendar')">日历</button>
</div>
<div id="setupBanner" style="display:none" class="setup-banner" onclick="showSetup()">
  <span class="sb-text">点击配置 GitHub 同步，让家人共享数据</span><span class="sb-arrow">›</span>
</div>

<!-- Courses View -->
<div class="view active" id="viewCourses">
  <div class="sbar" id="sbar"></div>
  <div class="clist" id="clist"></div>
</div>

<!-- Calendar View -->
<div class="view" id="viewCalendar">
  <div class="cal-hdr">
    <button class="cal-nav" onclick="navMonth(-1)">‹</button>
    <span class="cal-title" id="calTitle"></span>
    <button class="cal-nav" onclick="navMonth(1)">›</button>
  </div>
  <div class="wkdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
  <div class="cal-grid" id="calGrid"></div>
  <div id="dayPanel"></div>
</div>

<button class="fab" onclick="showAdd()">+</button>

<!-- Add Course Modal -->
<div class="overlay" id="addModal" onclick="closeOv(event,'addModal')">
<div class="mbox" onclick="event.stopPropagation()">
  <div class="mtitle"><span>添加课程</span><button class="mclose" onclick="hideOv('addModal')">✕</button></div>
  <div class="fg"><label class="fl">课程名称</label><input class="fi" id="fName" placeholder="如：钢琴课、游泳课" maxlength="20"></div>
  <div class="fg"><label class="fl">总课时</label><input class="fi" id="fTotal" type="number" min="1" max="999" placeholder="这节课包一共多少节"></div>
  <div class="fg"><label class="fl">选择图标</label><div class="ipick" id="ipick"></div></div>
  <div class="fg"><label class="fl">选择颜色</label><div class="cpick" id="cpick"></div></div>
  <button class="btn-p" onclick="addCourse()">添加课程</button>
</div></div>

<!-- Detail Modal -->
<div class="overlay" id="detModal" onclick="closeOv(event,'detModal')">
<div class="mbox" onclick="event.stopPropagation()">
  <div class="mtitle"><span>上课记录</span><button class="mclose" onclick="hideOv('detModal')">✕</button></div>
  <div id="detContent"></div>
</div></div>

<!-- Setup Modal -->
<div class="overlay" id="setupModal" onclick="closeOv(event,'setupModal')">
<div class="mbox" onclick="event.stopPropagation()">
  <div class="mtitle"><span>GitHub 同步设置</span><button class="mclose" onclick="hideOv('setupModal')">✕</button></div>
  <div class="setup-steps">
    <p><b>一次性设置（约3分钟）：</b></p>
    <ol>
      <li>去 <a href="https://github.com/new" target="_blank">GitHub</a> 新建一个<b>私有仓库</b>，名字随意（如 <code>class-tracker</code>）</li>
      <li>在仓库里新建文件 <code>data.json</code>，内容填 <code>{}</code>，提交</li>
      <li>去 <a href="https://github.com/settings/tokens/new" target="_blank">生成 Token</a>：勾选 <b>repo</b> 权限，点 Generate，复制 token</li>
      <li>在下方填入你的 GitHub 用户名、仓库名和 token</li>
    </ol>
    <p style="color:var(--text2);font-size:12px;margin-top:8px">家人也用同一个页面、填同样的信息，就能看到共享数据了。</p>
  </div>
  <div class="fg"><label class="fl">GitHub 用户名</label><input class="fi" id="sOwner" placeholder="你的 GitHub 用户名"></div>
  <div class="fg"><label class="fl">仓库名</label><input class="fi" id="sRepo" placeholder="class-tracker"></div>
  <div class="fg"><label class="fl">Personal Access Token</label><input class="fi" id="sToken" type="password" placeholder="ghp_xxxxxxxxxxxx"></div>
  <button class="btn-p" onclick="saveSetup()">保存并同步</button>
  <button class="btn-s" id="btnDisconnect" style="display:none" onclick="disconnect()">断开连接</button>
  <p id="setupStatus" style="text-align:center;font-size:12px;color:var(--text2);margin-top:10px"></p>
</div></div>

<script>
const ICONS=['🎹','🏊','⚽','🎨','🩰','🎻','🏀','🎤','✏️','🧮','📖','🥋','🎸','🏸','⛸️','🤸','🎭','💻','🔬','🌍'];
const COLORS=[{bg:'#FFE0B2'},{bg:'#BBDEFB'},{bg:'#C8E6C9'},{bg:'#F8BBD0'},{bg:'#D1C4E9'},{bg:'#FFE082'},{bg:'#B2EBF2'},{bg:'#FFCCBC'}];
const WKDAYS=['周日','周一','周二','周三','周四','周五','周六'];

let data={courses:[]},cfg={},selIcon=ICONS[0],selColor=COLORS[0];
let calYear,calMonth,selDate=null,syncing=false;

// ─── Data ───
function loadLocal(){try{const r=localStorage.getItem('ct_data');return r?JSON.parse(r):{courses:[]}}catch(e){return{courses:[]}}}
function saveLocal(){localStorage.setItem('ct_data',JSON.stringify(data))}
function loadCfg(){try{const r=localStorage.getItem('ct_gh');return r?JSON.parse(r):{}}catch(e){return{}}}
function saveCfg(){localStorage.setItem('ct_gh',JSON.stringify(cfg))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

// ─── GitHub API ───
async function ghFetch(){
  if(!cfg.token||!cfg.owner||!cfg.repo)return null;
  const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data.json`,{
    headers:{Authorization:`token ${cfg.token}`,Accept:'application/vnd.github.v3+json'}});
  if(r.ok){const j=await r.json();return{sha:j.sha,content:j.content?JSON.parse(atob(j.content)):null}}
  if(r.status===404)return{sha:null,content:null};
  throw new Error('GitHub '+r.status);
}
async function ghPut(content,sha){
  const body={message:'sync '+new Date().toLocaleString('zh-CN'),content:btoa(unescape(encodeURIComponent(JSON.stringify(content))))};
  if(sha)body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data.json`,{
    method:'PUT',headers:{Authorization:`token ${cfg.token}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('Write failed '+r.status);
  const j=await r.json();return j.content.sha;
}
function mergeData(local,remote){
  if(!remote||!remote.courses)return local;
  if(!local||!local.courses)return remote;
  const map=new Map();
  [...remote.courses,...local.courses].forEach(c=>{
    if(!map.has(c.id))map.set(c.id,{...c,records:[]});
    const m=map.get(c.id);
    // merge records: union by date
    const dates=new Set([...m.records.map(r=>r.date),...c.records.map(r=>r.date)]);
    m.records=[...dates].sort().map(d=>({date:d}));
    // keep latest metadata
    if(c.name)m.name=c.name;if(c.icon)m.icon=c.icon;if(c.color)m.color=c.color;
    if(c.total)m.total=Math.max(m.total,c.total);
  });
  return{courses:[...map.values()]};
}
async function syncPull(){
  setSync('syncing');
  try{
    const res=await ghFetch();
    if(res&&res.content&&res.content.courses){data=mergeData(data,res.content);saveLocal()}
    setSync('ok');
  }catch(e){console.warn('Sync pull failed:',e);setSync('err')}
}
async function syncPush(){
  if(!cfg.token)return;
  setSync('syncing');
  try{
    const res=await ghFetch();
    const merged=res&&res.content?mergeData(data,res.content):data;
    data=merged;saveLocal();
    await ghPut(merged,res?res.sha:null);
    setSync('ok');
  }catch(e){console.warn('Sync push failed:',e);setSync('err')}
}
function setSync(state){
  const dot=document.getElementById('syncDot');
  dot.className='sync-dot '+state;
  dot.title={ok:'已同步',off:'未连接',syncing:'同步中…',err:'同步失败'}[state]||'';
}

// ─── View Switch ───
function switchView(v){
  document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('active',i===(v==='courses'?0:1)));
  document.getElementById('viewCourses').classList.toggle('active',v==='courses');
  document.getElementById('viewCalendar').classList.toggle('active',v==='calendar');
  if(v==='calendar')renderCalendar();
  else renderAll();
}

// ─── Render: Summary ───
function renderSummary(){
  const el=document.getElementById('sbar');
  const tc=data.courses.length;
  const tr=data.courses.reduce((s,c)=>s+Math.max(0,c.total-c.records.length),0);
  const tu=data.courses.reduce((s,c)=>s+c.records.length,0);
  el.innerHTML=`<div class="schip"><span class="n" style="color:var(--secondary)">${tc}</span><span class="l">门课程</span></div>
    <div class="schip"><span class="n" style="color:var(--primary)">${tr}</span><span class="l">节待上</span></div>
    <div class="schip"><span class="n" style="color:var(--success)">${tu}</span><span class="l">节已上</span></div>`;
}

// ─── Render: Course List ───
function renderCourses(){
  const el=document.getElementById('clist');
  if(!data.courses.length){el.innerHTML='<div class="empty"><div class="em">📚</div><p>还没有添加课程<br>点击右下角 + 添加课包</p></div>';return}
  const td=todayStr();
  el.innerHTML=data.courses.map((c,i)=>{
    const u=c.records.length,rem=Math.max(0,c.total-u),pct=c.total>0?Math.min(100,u/c.total*100):0;
    const done=c.records.some(r=>r.date===td);
    return`<div class="ccard" onclick="showDet(${i})">
      <div class="ctop"><div class="cicon" style="background:${c.color}">${c.icon}</div>
      <div class="cinfo"><div class="cname">${esc(c.name)}</div><div class="csub">共${c.total}节</div></div></div>
      <button class="ckbtn${done?' done':''}" onclick="event.stopPropagation();quickCheck(${i})">${done?'✓ 已打卡':'打卡'}</button>
      <div class="cstats"><div class="si"><div class="v rem">${rem}</div><div class="l">剩余</div></div>
      <div class="si"><div class="v used">${u}</div><div class="l">已上</div></div>
      <div class="si"><div class="v tot">${c.total}</div><div class="l">总计</div></div></div>
      <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div></div>`;
  }).join('');
}

// ─── Render: Calendar ───
function initCal(){const d=new Date();calYear=d.getFullYear();calMonth=d.getMonth();selDate=todayStr()}
function navMonth(d){calMonth+=d;if(calMonth>11){calMonth=0;calYear++}if(calMonth<0){calMonth=11;calYear--}renderCalendar()}
function renderCalendar(){
  document.getElementById('calTitle').textContent=`${calYear}年${calMonth+1}月`;
  const grid=document.getElementById('calGrid');
  const first=new Date(calYear,calMonth,1);
  const daysIn=new Date(calYear,calMonth+1,0).getDate();
  let startDow=(first.getDay()+6)%7; // Mon=0
  const prevDays=new Date(calYear,calMonth,0).getDate();
  const td=todayStr();
  // Build record lookup: date -> [course]
  const recMap={};
  data.courses.forEach(c=>{c.records.forEach(r=>{
    if(!recMap[r.date])recMap[r.date]=[];
    recMap[r.date].push(c);
  })});
  let html='';
  // Prev month padding
  for(let i=startDow-1;i>=0;i--){
    html+=`<div class="cday other"><span class="dn">${prevDays-i}</span></div>`;
  }
  // Current month
  for(let d=1;d<=daysIn;d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===td,isSel=ds===selDate;
    const recs=recMap[ds]||[];
    const dots=recs.slice(0,4).map(c=>`<span class="dot" style="background:${c.color==='#BBDEFB'?'var(--secondary)':c.color}"></span>`).join('');
    html+=`<div class="cday${isToday?' today':''}${isSel?' sel':''}" onclick="pickDate('${ds}')">
      <span class="dn">${d}</span>${dots?`<div class="dots">${dots}</div>`:''}</div>`;
  }
  // Next month padding
  const total=startDow+daysIn;
  const rem=total%7===0?0:7-total%7;
  for(let d=1;d<=rem;d++){html+=`<div class="cday other"><span class="dn">${d}</span></div>`}
  grid.innerHTML=html;
  renderDayPanel();
}
function pickDate(ds){selDate=ds;renderCalendar()}
function renderDayPanel(){
  const el=document.getElementById('dayPanel');
  if(!selDate){el.innerHTML='';return}
  const d=new Date(selDate+'T00:00:00');
  const wd=WKDAYS[d.getDay()];
  const isToday=selDate===todayStr();
  if(!data.courses.length){el.innerHTML='<div class="day-panel" style="text-align:center;color:var(--text2)">还没有课程</div>';return}
  let html=`<div class="day-panel"><div class="day-panel-title">${selDate} <span class="wd">${wd}${isToday?' · 今天':''}</span></div>`;
  data.courses.forEach((c,i)=>{
    const done=c.records.some(r=>r.date===selDate);
    const rem=c.total-c.records.length;
    const full=rem<=0&&!done;
    html+=`<div class="dcourse">
      <div class="dcourse-icon" style="background:${c.color}">${c.icon}</div>
      <div class="dcourse-info"><div class="dcourse-name">${esc(c.name)}</div>
      <div class="dcourse-sub">${done?'已上课':full?'课包已上完':'剩余 '+rem+' 节'}</div></div>
      <button class="dcourse-btn ${done?'checked':full?'full':'checkin'}"
        onclick="${done?`undoFromCal(${i},'${selDate}')`:full?'':`checkFromCal(${i},'${selDate}')`}">
        ${done?'✓ 已上':'打卡'}</button></div>`;
  });
  html+='</div>';
  el.innerHTML=html;
}
function checkFromCal(ci,date){
  const c=data.courses[ci];
  if(c.records.some(r=>r.date===date)){toast('已有记录');return}
  if(c.total-c.records.length<=0){toast('课包已上完');return}
  c.records.push({date});c.records.sort((a,b)=>a.date.localeCompare(b.date));
  saveLocal();syncPush();showAnim();renderCalendar();renderAll();
}
function undoFromCal(ci,date){
  const c=data.courses[ci];
  const idx=c.records.findIndex(r=>r.date===date);
  if(idx>=0){c.records.splice(idx,1);saveLocal();syncPush();renderCalendar();renderAll()}
}

// ─── Quick Check-in (today) ───
function quickCheck(i){
  const c=data.courses[i],td=todayStr();
  if(c.records.some(r=>r.date===td)){toast('今天已打卡');return}
  if(c.total-c.records.length<=0){toast('课包已上完');return}
  c.records.push({date:td});c.records.sort((a,b)=>a.date.localeCompare(b.date));
  saveLocal();syncPush();showAnim();setTimeout(renderAll,400);
}

// ─── Add Course ───
function showAdd(){selIcon=ICONS[0];selColor=COLORS[0];
  document.getElementById('fName').value='';document.getElementById('fTotal').value='';
  renderIP();renderCP();showOv('addModal')}
function renderIP(){document.getElementById('ipick').innerHTML=ICONS.map(ic=>`<div class="iopt${ic===selIcon?' sel':''}" onclick="pickI('${ic}')">${ic}</div>`).join('')}
function renderCP(){document.getElementById('cpick').innerHTML=COLORS.map((c,i)=>`<div class="copt${c===selColor?' sel':''}" style="background:${c.bg}" onclick="pickC(${i})"></div>`).join('')}
function pickI(ic){selIcon=ic;renderIP()}function pickC(i){selColor=COLORS[i];renderCP()}
function addCourse(){
  const name=document.getElementById('fName').value.trim();
  const total=parseInt(document.getElementById('fTotal').value);
  if(!name){toast('请输入课程名称');return}if(!total||total<1){toast('请输入有效课时数');return}
  data.courses.push({id:uid(),name,icon:selIcon,color:selColor.bg,total,records:[],createdAt:todayStr()});
  saveLocal();syncPush();hideOv('addModal');renderAll();renderCalendar();
}

// ─── Course Detail ───
function showDet(i){
  const c=data.courses[i],u=c.records.length,rem=Math.max(0,c.total-u);
  const sorted=[...c.records].sort((a,b)=>b.date.localeCompare(a.date));
  let html=`<div class="dhdr"><div class="dicon" style="background:${c.color}">${c.icon}</div><div class="dname">${esc(c.name)}</div></div>
    <div class="dnums"><div class="dni"><div class="v" style="color:var(--primary)">${rem}</div><div class="l">剩余</div></div>
    <div class="dni"><div class="v" style="color:var(--success)">${u}</div><div class="l">已上</div></div>
    <div class="dni"><div class="v" style="color:var(--secondary)">${c.total}</div><div class="l">总计</div></div></div>`;
  if(!sorted.length){html+='<p style="text-align:center;color:var(--text2);padding:16px 0">还没有上课记录</p>'}
  else{html+='<div class="hlist">';sorted.forEach(r=>{
    const idx=c.records.indexOf(r),d=new Date(r.date+'T00:00:00'),wd=WKDAYS[d.getDay()];
    html+=`<div class="hitem"><div class="hdot"></div><div class="hdate">${r.date}</div><div class="hday">${wd}</div>
      <button class="hundo" onclick="undoDet(${i},${idx})">撤销</button></div>`;
  });html+='</div>'}
  html+=`<div class="danger"><button class="btn-d" onclick="delCourse(${i})">删除课程</button></div>`;
  document.getElementById('detContent').innerHTML=html;showOv('detModal');
}
function undoDet(ci,ri){data.courses[ci].records.splice(ri,1);saveLocal();syncPush();showDet(ci);renderAll();renderCalendar()}
function delCourse(i){if(!confirm(`确定删除「${data.courses[i].name}」？所有记录将清除。`))return;
  data.courses.splice(i,1);saveLocal();syncPush();hideOv('detModal');renderAll();renderCalendar()}

// ─── Setup ───
function showSetup(){
  const has=!!cfg.token;
  document.getElementById('sOwner').value=cfg.owner||'';
  document.getElementById('sRepo').value=cfg.repo||'';
  document.getElementById('sToken').value=cfg.token||'';
  document.getElementById('btnDisconnect').style.display=has?'block':'none';
  document.getElementById('setupStatus').textContent=has?'已连接 ✓':'未连接';
  showOv('setupModal');
}
async function saveSetup(){
  const owner=document.getElementById('sOwner').value.trim();
  const repo=document.getElementById('sRepo').value.trim();
  const token=document.getElementById('sToken').value.trim();
  if(!owner||!repo||!token){toast('请填写完整信息');return}
  cfg={owner,repo,token};saveCfg();
  document.getElementById('setupStatus').textContent='正在验证连接…';
  try{
    const res=await ghFetch();
    if(res===null){
      // Try to create the file
      await ghPut(data,null);
    }else{
      // Pull existing data
      if(res.content&&res.content.courses){data=mergeData(data,res.content);saveLocal()}
      // Push our data
      await ghPut(data,res.sha);
    }
    document.getElementById('setupStatus').textContent='连接成功！数据已同步 ✓';
    setSync('ok');
    document.getElementById('setupBanner').style.display='none';
    renderAll();renderCalendar();
    setTimeout(()=>hideOv('setupModal'),1200);
  }catch(e){
    document.getElementById('setupStatus').textContent='连接失败：'+e.message;
    setSync('err');
  }
}
function disconnect(){cfg={};saveCfg();setSync('off');
  document.getElementById('setupBanner').style.display='';hideOv('setupModal');toast('已断开连接')}

// ─── Helpers ───
function renderAll(){renderSummary();renderCourses()}
function showOv(id){document.getElementById(id).classList.add('show')}
function hideOv(id){document.getElementById(id).classList.remove('show')}
function closeOv(e,id){if(e.target===e.currentTarget)hideOv(id)}
function showAnim(){const el=document.createElement('div');el.className='ckanim';el.textContent='✓';
  document.body.appendChild(el);setTimeout(()=>el.remove(),700)}
function toast(m){const el=document.createElement('div');el.className='toast';el.textContent=m;
  document.body.appendChild(el);setTimeout(()=>el.remove(),1500)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ─── Init ───
data=loadLocal();cfg=loadCfg();
if(cfg.token)setSync('ok');else document.getElementById('setupBanner').style.display='';
initCal();renderAll();
// Auto pull on load
if(cfg.token){syncPull().then(()=>{renderAll();renderCalendar()})}
</script>
